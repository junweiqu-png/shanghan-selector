name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate browser and build scripts
        run: |
          node --check app.js
          node --check sources.js
          node --check terms.js
          node --check enhance.js
          node --check formula-data.js
          node --check compare.js
          node --check search-engine.js
          node --check library.js
          node --check scripts/build-site.mjs
          node --check scripts/build-ngram-index.mjs
      - name: Restore corpus API cache
        uses: actions/cache@v4
        with:
          path: .corpus-cache
          key: corpus-wikisource-v1-${{ github.run_id }}
          restore-keys: |
            corpus-wikisource-v1-
      - name: Install Chinese conversion helper
        run: npm install --no-save opencc-js@1.4.2
      - name: Build local classical corpus
        env:
          CORPUS_MAX_BOOKS: 700
        run: node scripts/build-site.mjs
      - name: Bundle OpenCC for browser search
        run: mkdir -p dist/vendor/opencc-js && cp -R node_modules/opencc-js/dist/esm/. dist/vendor/opencc-js/
      - name: Build Chinese n-gram inverted index
        run: node scripts/build-ngram-index.mjs
      - name: Remove temporary corpus pages
        run: rm -rf dist/corpus-pages
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
